# Example Docker Hub secret for Kubernetes image pull authentication
#
# To generate your actual secret, you can run:
# kubectl create secret docker-registry dockerhub-secret \
#   --docker-server=https://index.docker.io/v1/ \
#   --docker-username=<YOUR_DOCKERHUB_USERNAME> \
#   --docker-password=<YOUR_DOCKERHUB_ACCESS_TOKEN_OR_PASSWORD> \
#   --docker-email=<YOUR_EMAIL> \
#   --dry-run=client -o yaml > infra/k8s/dockerhub-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded ~/.docker/config.json
  .dockerconfigjson: <BASE64_ENCODED_DOCKERCONFIGJSON>
